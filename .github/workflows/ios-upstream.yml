name: Build upstream-core iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios-upstream-core
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ios/**"
      - "vita3k/**"
      - "external/**"
      - ".ci/package-ios.sh"
      - ".github/workflows/ios-upstream.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ios/**"
      - "vita3k/**"
      - "external/**"
      - ".ci/package-ios.sh"
      - ".github/workflows/ios-upstream.yml"

permissions:
  contents: read

concurrency:
  group: ios-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: Upstream core arm64 device link
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Check out source and upstream dependencies
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          echo "VCPKG_ROOT=${VCPKG_ROOT}"

      - name: Install MoltenVK package
        run: |
          brew install molten-vk
          MVK_ROOT="$(brew --prefix molten-vk)"
          MVK_LIBRARY="$(find "$MVK_ROOT" -type f -name libMoltenVK.a -ipath '*ios*' | head -n 1)"
          if [[ -z "$MVK_LIBRARY" ]]; then
            echo "No iOS libMoltenVK.a found under $MVK_ROOT" >&2
            find "$MVK_ROOT" -maxdepth 6 -print | sort >&2
            exit 1
          fi
          test -f "$MVK_ROOT/include/MoltenVK/mvk_vulkan.h"
          echo "VITA3K_IOS_MOLTENVK_LIBRARY=$MVK_LIBRARY" >> "$GITHUB_ENV"
          echo "VITA3K_IOS_MOLTENVK_INCLUDE_DIR=$MVK_ROOT/include" >> "$GITHUB_ENV"
          file "$MVK_LIBRARY"

      - name: Configure upstream core iOS application
        run: |
          cmake -S . -B build-ios-upstream -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DVITA3K_BUILD_IOS_UPSTREAM_CORE=ON \
            -DVITA3K_BUILD_IOS=OFF \
            -DVITA3K_IOS_DEPLOYMENT_TARGET=17.0 \
            -DVITA3K_IOS_LINK_CORE=ON \
            -DVITA3K_IOS_MOLTENVK_LIBRARY="$VITA3K_IOS_MOLTENVK_LIBRARY" \
            -DVITA3K_IOS_MOLTENVK_INCLUDE_DIR="$VITA3K_IOS_MOLTENVK_INCLUDE_DIR" \
            -DVITA3K_FORCE_SYSTEM_BOOST=ON \
            -DUSE_DISCORD_RICH_PRESENCE=OFF \
            -DUSE_VITA3K_UPDATE=OFF \
            -DUSE_LTO=NEVER

      - name: Build unsigned upstream-core device application
        run: |
          cmake --build build-ios-upstream \
            --config Release \
            --target Vita3KiOS \
            -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package and verify unsigned IPA
        run: |
          mkdir -p artifacts
          bash ./.ci/package-ios.sh \
            --build-dir build-ios-upstream \
            --configuration Release \
            --output artifacts/Vita3K-upstream-core-iOS-unsigned.ipa

      - name: Upload unsigned upstream-core IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-upstream-core-iOS-${{ github.sha }}-unsigned
          path: artifacts/Vita3K-upstream-core-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
