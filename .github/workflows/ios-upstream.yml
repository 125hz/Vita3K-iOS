name: Build upstream-core iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios-upstream-core
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ios/**"
      - "vita3k/**"
      - "external/**"
      - ".ci/package-ios.sh"
      - ".github/workflows/ios-upstream.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ios/**"
      - "vita3k/**"
      - "external/**"
      - ".ci/package-ios.sh"
      - ".github/workflows/ios-upstream.yml"

permissions:
  contents: read

concurrency:
  group: ios-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: Upstream core arm64 device link
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Check out source and upstream dependencies
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Apply iOS submodule patches
        run: |
          # dynarmic/oaknut is a nested submodule; CI restores its pinned
          # commit, so iOS-specific fixes live as patches applied here.
          git -C external/dynarmic/externals/oaknut apply --verbose \
            "${GITHUB_WORKSPACE}/ios/patches/0001-oaknut-ios-rwx-jit.patch"

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Bootstrap pinned vcpkg
        run: |
          mkdir -p build-deps
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git build-deps/vcpkg
          git -C build-deps/vcpkg checkout 77df67cfff9c12ccfdb52284e07c87c75092f723
          ./build-deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$PWD/build-deps/vcpkg" >> "$GITHUB_ENV"

      - name: Restore iOS vcpkg binary archive
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-arm64-ios-77df67c-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-arm64-ios-77df67c-

      - name: Install pinned MoltenVK iOS package
        run: |
          mkdir -p build-deps/moltenvk
          curl --fail --location --retry 3 \
            --output build-deps/MoltenVK-ios.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.1/MoltenVK-ios.tar
          echo "54336b90212c390ed5935c96460aed3bf651ad7d3c0f0e956586ce18e9c0b701  build-deps/MoltenVK-ios.tar" \
            | shasum -a 256 --check
          tar -xf build-deps/MoltenVK-ios.tar -C build-deps/moltenvk
          MVK_ROOT="$PWD/build-deps/moltenvk/MoltenVK/MoltenVK"
          MVK_LIBRARY="$MVK_ROOT/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          test -f "$MVK_LIBRARY"
          test -f "$MVK_ROOT/include/MoltenVK/mvk_vulkan.h"
          echo "VITA3K_IOS_MOLTENVK_LIBRARY=$MVK_LIBRARY" >> "$GITHUB_ENV"
          echo "VITA3K_IOS_MOLTENVK_INCLUDE_DIR=$MVK_ROOT/include" >> "$GITHUB_ENV"
          file "$MVK_LIBRARY"

      - name: Configure upstream core iOS application
        run: |
          cmake -S . -B build-ios-upstream -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DVITA3K_BUILD_IOS_UPSTREAM_CORE=ON \
            -DVITA3K_BUILD_IOS=OFF \
            -DVITA3K_IOS_DEPLOYMENT_TARGET=17.0 \
            -DVITA3K_IOS_LINK_CORE=ON \
            -DVITA3K_IOS_MOLTENVK_LIBRARY="$VITA3K_IOS_MOLTENVK_LIBRARY" \
            -DVITA3K_IOS_MOLTENVK_INCLUDE_DIR="$VITA3K_IOS_MOLTENVK_INCLUDE_DIR" \
            -DVITA3K_FORCE_SYSTEM_BOOST=ON \
            -DUSE_DISCORD_RICH_PRESENCE=OFF \
            -DUSE_VITA3K_UPDATE=OFF \
            -DUSE_LTO=NEVER

      - name: Save iOS vcpkg binary archive
        # vcpkg populates its archives during configure; save them even when a
        # later configure/build step fails so iteration runs stay fast.
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-arm64-ios-77df67c-${{ hashFiles('vcpkg.json') }}

      - name: Build unsigned upstream-core device application
        run: |
          cmake --build build-ios-upstream \
            --config Release \
            --target Vita3KiOS \
            -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package and verify unsigned IPA
        run: |
          mkdir -p artifacts
          bash ./.ci/package-ios.sh \
            --build-dir build-ios-upstream \
            --configuration Release \
            --output artifacts/Vita3K-upstream-core-iOS-unsigned.ipa

      - name: Upload unsigned upstream-core IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-upstream-core-iOS-${{ github.sha }}-unsigned
          path: artifacts/Vita3K-upstream-core-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
